plugins {
    id 'base'
}

tasks.register('verifyResources') {
    doLast {
        def parser = javax.xml.parsers.DocumentBuilderFactory.newInstance().newDocumentBuilder()
        fileTree('assets').matching { include '**/*.svg' }.each { parser.parse(it) }
        fileTree('src').matching { include '**/*.js' }.each { source ->
            def matcher = source.text =~ /(?:from\s+|import\s*)['"](\.[^'"]+)['"]/
            matcher.each { match ->
                if (!new File(source.parentFile, match[1]).isFile()) {
                    throw new GradleException("Missing import: ${source}: ${match[1]}")
                }
            }
            providers.exec { commandLine 'node', '--check', source.absolutePath }.result.get().assertNormalExitValue()
        }
    }
}

tasks.register('verifyNaval', Exec) {
    commandLine 'node', 'scripts/verify.js'
}

tasks.register('site', Sync) {
    dependsOn 'verifyResources'
    from('.') {
        include 'index.html', 'src/**/*.js', 'styles/*.css', 'assets/**/*.svg', 'README.md'
    }
    into layout.buildDirectory.dir('site')
}

tasks.register('distribution', Zip) {
    dependsOn 'site'
    from layout.buildDirectory.dir('site')
    archiveFileName = 'seven-seas-expedition.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
}

check.dependsOn 'verifyResources', 'verifyNaval'
assemble.dependsOn 'distribution'
