<title id="title">单桅巡逻帆船</title>
<desc id="desc">战舰；1 桅纵帆；1 层主炮甲板；1 个游戏炮组。快速侦察 · 近岸巡逻。原创矢量侧面示意，炮门数量与尺度不代表逐炮复原。</desc>
