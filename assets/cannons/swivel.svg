<title id="title">旋回小炮</title>
<desc id="desc">轻型炮；小型散弹炮；近距；炮架承重等级 1；火力 8；每炮组弹耗系数 0.25。舷缘叉架上的轻型旋回炮，擅长近距离压制甲板与支援接舷，远射弱。 原创结构示意，不是比例工程图。</desc>
