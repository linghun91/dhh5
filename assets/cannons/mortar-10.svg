<title id="title">10 寸舰臼炮</title>
<desc id="desc">臼炮与榴弹炮；10 寸抛射弹；近距；炮架承重等级 4；火力 27；每炮组弹耗系数 0.9。炮击舰使用的曲射臼炮，对近距甲板与岸防有效，远射极差。 原创结构示意，不是比例工程图。</desc>
