<title id="title">32 磅卡隆炮</title>
<desc id="desc">18 世纪后期短管大口径卡隆炮：粗短炮身、管底连接耳、滑动木炮床、甲板旋转支点与后部仰角丝杠；配 32 磅实心弹，区别于同弹重的长炮。原创类型示意。</desc>
