<title id="title">24 磅短炮</title>
<desc id="desc">舰用长短炮；24 磅实心弹；中距；炮架承重等级 3；火力 26；每炮组弹耗系数 0.75。缩短的 24 磅炮，让承重不足的船体也能打出中距重弹。 原创结构示意，不是比例工程图。</desc>
