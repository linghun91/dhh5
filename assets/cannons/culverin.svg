<title id="title">青铜长管蛇炮</title>
<desc id="desc">16 至 17 世纪长管蛇炮类型：青铜铸造的纤长炮管、多道装饰炮箍、成对海豚式吊耳、浮雕与木质舰用炮床；名称不是现代固定磅制口径。原创类型示意。</desc>
