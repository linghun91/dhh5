<title id="title">32 磅短炮</title>
<desc id="desc">舰用长短炮；32 磅实心弹；中距；炮架承重等级 4；火力 31；每炮组弹耗系数 0.95。缩短身管的 32 磅炮，让四级舰在中距打出接近下层炮甲板的重量。 原创结构示意，不是比例工程图。</desc>
