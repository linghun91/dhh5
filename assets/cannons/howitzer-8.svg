<title id="title">8 寸榴弹炮</title>
<desc id="desc">臼炮与榴弹炮；8 寸榴弹；近距；炮架承重等级 3；火力 24；每炮组弹耗系数 0.7。短身管曲射炮，近距以爆炸弹打击甲板与索具。 原创结构示意，不是比例工程图。</desc>
