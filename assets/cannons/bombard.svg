<title id="title">舰载臼炮</title>
<desc id="desc">臼炮与榴弹炮；抛射弹；近距；炮架承重等级 4；火力 28；每炮组弹耗系数 0.85。早期抛射重炮，近距砸击敌舰甲板，远射几乎无效。 原创结构示意，不是比例工程图。</desc>
