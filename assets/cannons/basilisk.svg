<title id="title">蛇怪重炮</title>
<desc id="desc">早期火炮；蛇怪重弹；远距；炮架承重等级 5；火力 36；每炮组弹耗系数 1.2。早期超重长炮，名称来自传说中的蛇怪，射程与弹重都接近后期 32 磅以上长炮。 原创结构示意，不是比例工程图。</desc>
