<title id="title">半加农炮</title>
<desc id="desc">早期半加农炮类型：比蛇炮更粗短的青铜炮身、明显扩口、加强炮箍与装饰吊耳，配厚木炮床和实心轮；历史名称随时代地区变化。原创类型示意，不是固定 32 磅制炮复刻。</desc>
