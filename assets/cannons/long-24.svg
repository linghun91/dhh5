<title id="title">24 磅长炮</title>
<desc id="desc">舰用长短炮；24 磅实心弹；远距；炮架承重等级 4；火力 29；每炮组弹耗系数 0.85。适合较大军舰炮甲板的重型长炮，远距火力强，需要更多弹药和承重。 原创结构示意，不是比例工程图。</desc>
