<title id="title">18 磅长炮</title>
<desc id="desc">舰用长短炮；18 磅实心弹；远距；炮架承重等级 3；火力 23；每炮组弹耗系数 0.65。重型护卫舰的代表主炮，在威力与承重之间取得平衡，也可用于战列舰上层。 原创结构示意，不是比例工程图。</desc>
